{% extends "base.html" %}

{% block body %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Analysis in Progress</h4>
                </div>
                <div class="card-body text-center">
                    <div class="mb-4">
                        <div class="spinner-border text-primary" role="status" style="width: 4rem; height: 4rem;">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                    
                    <h5 id="progress-message">Starting analysis...</h5>
                    
                    <div class="progress mb-4" style="height: 25px;">
                        <div id="progress-bar" class="progress-bar progress-bar-striped progress-bar-animated" 
                             role="progressbar" style="width: 0%">0%</div>
                    </div>
                    
                    <div class="alert alert-info" id="current-url" style="display: none;">
                        <i class="bi bi-link"></i> <span id="url-text"></span>
                    </div>
                    
                    <div class="mt-4">
                        <a href="{{ url_for('dashboard', username=current_user.email) }}" class="btn btn-secondary">
                            <i class="bi bi-arrow-left"></i> Back to Dashboard
                        </a>
                        <button id="cancel-btn" class="btn btn-danger" onclick="cancelAnalysis()">
                            <i class="bi bi-x-circle"></i> Cancel Analysis
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
const jobId = "{{ job_id }}";

function checkProgress() {
    fetch(`/check_selected_analysis/${jobId}`)
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                document.getElementById('progress-message').innerHTML = 
                    `<span class="text-danger">Error: ${data.error}</span>`;
                return;
            }
            
            // Update progress
            const progressBar = document.getElementById('progress-bar');
            progressBar.style.width = `${data.progress}%`;
            progressBar.textContent = `${data.progress}%`;
            
            // Update message
            document.getElementById('progress-message').textContent = data.message;
            
            // Show current URL if available
            if (data.message && data.message.includes('Analyzing URL')) {
                const urlMatch = data.message.match(/Analyzing URL .*?: (.*)/);
                if (urlMatch) {
                    document.getElementById('url-text').textContent = urlMatch[1];
                    document.getElementById('current-url').style.display = 'block';
                }
            }
            
            // Check status
            if (data.status === 'completed') {
                // Redirect to download or dashboard
                if (data.download_url) {
                    window.location.href = data.download_url;
                } else {
                    window.location.href = "{{ url_for('dashboard', username=current_user.email) }}";
                }
            } else if (data.status === 'failed' || data.status === 'canceled') {
                document.getElementById('progress-message').innerHTML = 
                    `<span class="text-danger">Analysis ${data.status}: ${data.message}</span>`;
                document.getElementById('cancel-btn').style.display = 'none';
            } else {
                // Continue checking
                setTimeout(checkProgress, 2000);
            }
        })
        .catch(error => {
            console.error('Error checking progress:', error);
            setTimeout(checkProgress, 5000);
        });
}

function cancelAnalysis() {
    if (confirm('Are you sure you want to cancel the analysis?')) {
        fetch('/cancel_analysis', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token() }}'
            },
            body: JSON.stringify({ job_id: jobId })
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                document.getElementById('progress-message').textContent = 'Cancellation requested...';
                document.getElementById('cancel-btn').disabled = true;
            }
        });
    }
}

// Start checking progress
checkProgress();
</script>
{% endblock %}
